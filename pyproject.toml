[project]
name = "ai-price-predictor"
version = "1.0.0"
description = "ML-powered 'when to buy' forecasts for Amazon/Flipkart products"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# E501 ignored (line length handled by ruff format), E712 ignored for pandas/sklearn idioms
ignore = ["E501", "E712"]
[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402", "W605"]     # App module keeps cosmetic strings / lazy imports inline
"charts.py" = ["W605"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]